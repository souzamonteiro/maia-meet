<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131c">
    <title>Maia Meet</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app">
        <!-- Notification Toast Area -->
        <div id="notifications" role="status" aria-live="polite"></div>
        <header class="app-header">
            <span class="brand">Maia <strong>Meet</strong></span>
            <span class="badge">MEDIA APPS</span>
            <span class="app-description">Video meetings, together.</span>
        </header>
        <main class="workspace">

        <!-- Lobby View -->
        <div id="view-lobby" class="view active">
            <div class="lobby-card">
                <p class="eyebrow">YOUR MEETING SPACE</p>
                <h1>Let’s meet.</h1>
                <p class="description">Start a conversation or join your team with a room ID.</p>
                <div class="form-group">
                    <label for="display-name">Display Name</label>
                    <input type="text" id="display-name" placeholder="Enter your name" maxlength="50" autocomplete="name" />
                </div>
                <div class="form-actions">
                    <button id="btn-new-meeting" class="btn-primary">New Meeting</button>
                </div>
                <div class="divider"><span>OR</span></div>
                <div class="form-group">
                    <label for="room-id">Room ID</label>
                    <input type="text" id="room-id" placeholder="Enter Room ID" maxlength="32" autocomplete="off" spellcheck="false" />
                </div>
                <div class="form-actions">
                    <button id="btn-join-lobby" class="btn-secondary">Join</button>
                </div>
            </div>
        </div>

        <!-- Preview View -->
        <div id="view-preview" class="view">
            <div class="preview-container">
                <p class="eyebrow">CAMERA &amp; AUDIO</p>
                <h2>Ready to join?</h2>
                <p class="description">Check your camera and microphone before entering the room.</p>
                <div class="video-preview-wrapper">
                    <video id="local-preview-video" autoplay muted playsinline></video>
                    <div class="audio-level-indicator">
                        <div id="audio-level-bar"></div>
                    </div>
                </div>
                <div class="device-controls">
                    <div class="form-group">
                        <label for="camera-select">Camera</label>
                        <select id="camera-select"></select>
                    </div>
                    <div class="form-group">
                        <label for="mic-select">Microphone</label>
                        <select id="mic-select"></select>
                    </div>
                </div>
                <div class="preview-actions">
                    <button id="btn-toggle-preview-mic" class="btn-icon">Mute microphone</button>
                    <button id="btn-toggle-preview-cam" class="btn-icon">Turn camera off</button>
                </div>
                <div class="preview-actions-main">
                    <button id="btn-back-preview" class="btn-secondary">Back</button>
                    <button id="btn-join-room" class="btn-primary">Join Room</button>
                </div>
            </div>
        </div>

        <!-- Room View -->
        <div id="view-room" class="view">
            <div class="room-layout">
                <div class="main-content">
                    <div id="video-grid" class="video-grid">
                        <!-- Video tiles go here -->
                    </div>

                    <div class="toolbar" role="group" aria-label="Meeting controls">
                        <button id="btn-toggle-mic" class="btn-toolbar" aria-label="Microphone">Microphone</button>
                        <button id="btn-toggle-cam" class="btn-toolbar" aria-label="Camera">Camera</button>
                        <button id="btn-toggle-screen" class="btn-toolbar" aria-label="Share screen">Share screen</button>
                        <button id="btn-toggle-record" class="btn-toolbar" aria-label="Record locally">Record locally</button>
                        <button id="btn-toggle-participants" class="btn-toolbar" aria-label="Participants">Participants</button>
                        <button id="btn-toggle-chat" class="btn-toolbar" aria-label="Chat">Chat</button>
                        <button id="btn-leave" class="btn-toolbar btn-danger">Leave</button>
                    </div>
                </div>

                <div id="sidebar-panel" class="sidebar">
                    <div id="chat-panel" class="panel active">
                        <div class="panel-header">
                            <h3>Chat</h3>
                        </div>
                        <div id="chat-messages" class="chat-messages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" aria-label="Chat message" maxlength="4000" placeholder="Type a message..." />
                            <button id="btn-send-chat" class="btn-primary">Send</button>
                        </div>
                    </div>
                    <div id="participants-panel" class="panel">
                        <div class="panel-header">
                            <h3>Participants</h3>
                        </div>
                        <ul id="participants-list" class="participants-list"></ul>
                    </div>
                </div>
            </div>
        </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
